name: app-image

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Image profile to build
        type: choice
        default: both
        options: [both, slim, full]
      publish:
        description: Publish verified images to GHCR (otherwise use a disposable local registry)
        type: boolean
        default: false
      force-runtime:
        description: Rebuild the runtime without layer cache (for OS updates)
        type: boolean
        default: false
      verify-reuse:
        description: Exercise a second runtime lookup and assert that it reuses the same digest
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - packages/server/**
      - packages/shared/**
      - packages/cli/**
      - packages/deploy/src/**
      - packages/deploy/templates/**
      - packages/deploy/runtime/**
      - scripts/runtime-image.mjs
      - scripts/realtime-e2e.py
      - .github/actions/ensure-runtime/**
      - .github/workflows/app-image.yml

permissions:
  contents: read
  packages: write

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: runtime-${{ github.repository }}-${{ matrix.profile }}-${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.event_name == 'workflow_dispatch' && inputs.profile != 'both' && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["slim","full"]') }}
    services:
      registry:
        image: registry:3
        ports: [5000:5000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reclaim space for TeX images
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Ensure runtime
        id: runtime
        uses: ./.github/actions/ensure-runtime
        with:
          profile: ${{ matrix.profile }}
          publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          force: ${{ inputs.force-runtime || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Exercise runtime cache hit
        id: reuse
        if: inputs.verify-reuse
        uses: ./.github/actions/ensure-runtime
        with:
          profile: ${{ matrix.profile }}
          publish: ${{ inputs.publish }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert reuse kept the verified digest
        if: inputs.verify-reuse
        env:
          ORIGINAL: ${{ steps.runtime.outputs.ref }}
          REUSED: ${{ steps.reuse.outputs.ref }}
          CACHE_HIT: ${{ steps.reuse.outputs.reused }}
        run: |
          test "$CACHE_HIT" = true
          test "$ORIGINAL" = "$REUSED"
      - name: Prepare application context
        id: context
        env:
          PROFILE: ${{ matrix.profile }}
          RUNTIME: ${{ steps.runtime.outputs.ref }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          registry=localhost:5000
          if [ "$PUBLISH" = true ]; then registry=ghcr.io; fi
          image="$registry/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "candidate=$image:ci-$PROFILE-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          node packages/deploy/src/index.ts bundle --profile "$PROFILE" --runtime-image "$RUNTIME" --out dist/app
      - name: Build application candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: dist/app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.context.outputs.candidate }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.context.outputs.build_date }}
          cache-from: type=gha,scope=app-${{ matrix.profile }}
          cache-to: type=gha,scope=app-${{ matrix.profile }},mode=max
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: packages/cli/go.sum
      - name: Verify realtime compilation in disposable containers
        env:
          IMAGE: ${{ steps.context.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          (cd packages/cli && GOWORK=off go build -trimpath -o dist/latexmk ./cmd/latexmk)
          docker pull "$IMAGE@$DIGEST"
          python3 scripts/realtime-e2e.py --image "$IMAGE@$DIGEST"
          docker pull postgres:17-alpine
          database_image=$(docker inspect --format '{{index .RepoDigests 0}}' postgres:17-alpine)
          python3 scripts/realtime-e2e.py --image "$IMAGE@$DIGEST" --database-image "$database_image"
      - name: Promote verified application
        env:
          IMAGE: ${{ steps.context.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROFILE: ${{ matrix.profile }}
        run: |
          node scripts/runtime-image.mjs promote --image "$IMAGE" --tag "$PROFILE-$GITHUB_SHA" --ref "$IMAGE@$DIGEST"
          printf 'Application image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
