name: app-image

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Image profile to publish
        type: choice
        default: both
        options: [both, slim, full]
  push:
    branches: [main]
    paths:
      - packages/server/**
      - packages/deploy/src/**
      - packages/deploy/templates/Dockerfile.app
      - packages/deploy/runtime/lock.json
      - .github/workflows/app-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.event_name == 'workflow_dispatch' && inputs.profile != 'both' && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["slim","full"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare application context
        id: context
        env:
          PROFILE: ${{ matrix.profile }}
          SLIM_RUNTIME: ${{ vars.LATEXMK_RUNTIME_SLIM }}
          FULL_RUNTIME: ${{ vars.LATEXMK_RUNTIME_FULL }}
        run: |
          if [ "$PROFILE" = slim ]; then runtime="$SLIM_RUNTIME"; else runtime="$FULL_RUNTIME"; fi
          if ! [[ "$runtime" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/:-]*@sha256:[a-f0-9]{64}$ ]]; then
            echo "Set LATEXMK_RUNTIME_${PROFILE^^} to the digest printed by runtime-image before publishing an application."
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          node packages/deploy/src/index.ts bundle --profile "$PROFILE" --runtime-image "$runtime" --out dist/app
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish application
        id: build
        uses: docker/build-push-action@v6
        with:
          context: dist/app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.context.outputs.image }}:${{ matrix.profile }}-${{ github.sha }}
          build-args: |
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.context.outputs.build_date }}
          cache-from: type=gha,scope=app-${{ matrix.profile }}
          cache-to: type=gha,scope=app-${{ matrix.profile }},mode=max
      - name: Record application image
        env:
          IMAGE: ${{ steps.context.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Application image: `%s@%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
