name: runtime-image

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Runtime profile to build
        type: choice
        default: both
        options: [both, slim, full]
      publish:
        description: Publish verified runtimes to GHCR (otherwise use a disposable local registry)
        type: boolean
        default: false
      force:
        description: Rebuild without layer cache (for OS updates)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: runtime-${{ github.repository }}-${{ matrix.profile }}-${{ inputs.publish }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ inputs.profile != 'both' && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["slim","full"]') }}
    services:
      registry:
        image: registry:3
        ports: [5000:5000]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reclaim space for TeX images
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: ./.github/actions/ensure-runtime
        with:
          profile: ${{ matrix.profile }}
          publish: ${{ inputs.publish }}
          force: ${{ inputs.force }}
          token: ${{ secrets.GITHUB_TOKEN }}
