name: runtime-image

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Image profile to build
        type: choice
        default: both
        options: [both, slim, full]
      publish:
        description: Publish the tested images to GHCR
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - packages/deploy/runtime/**
      - packages/deploy/src/**
      - packages/deploy/templates/rename-compat-fonts.py
      - .github/workflows/runtime-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: runtime-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ github.event_name == 'workflow_dispatch' && inputs.profile != 'both' && fromJSON(format('["{0}"]', inputs.profile)) || fromJSON('["slim","full"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare runtime context
        id: context
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-runtime"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          node packages/deploy/src/index.ts runtime-bundle --profile "$PROFILE" --out dist/runtime
      - name: Build, smoke test, and publish runtime
        id: build
        uses: docker/build-push-action@v6
        with:
          context: dist/runtime
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          load: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          tags: ${{ steps.context.outputs.image }}:${{ matrix.profile }}-${{ github.sha }}
          cache-from: type=gha,scope=runtime-${{ matrix.profile }}
          cache-to: type=gha,scope=runtime-${{ matrix.profile }},mode=max
      - name: Extract and verify font inventory
        env:
          IMAGE: ${{ steps.context.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROFILE: ${{ matrix.profile }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          mkdir -p dist/font-inventory
          if [ "$PUBLISH" = true ]; then ref="$IMAGE@$DIGEST"; else ref="$IMAGE:$PROFILE-$GITHUB_SHA"; fi
          printf '%s\n' "$ref" > dist/font-inventory/image.txt
          docker run --rm --entrypoint sh "$ref" -c 'sha256sum -c /usr/local/lib/latexmk/fonts.sha256' > dist/font-inventory/verification.txt
          docker image inspect "$ref" --format '{{.Id}}' > dist/font-inventory/local-image-id.txt
          for file in fonts.tsv fonts.sha256 debian-packages.txt texlive.tlpdb texlive-repository.txt; do
            docker run --rm --entrypoint cat "$ref" "/usr/local/lib/latexmk/$file" > "dist/font-inventory/$file"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: font-inventory-${{ matrix.profile }}
          path: dist/font-inventory/
      - name: Record immutable runtime reference
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          IMAGE: ${{ steps.context.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROFILE: ${{ matrix.profile }}
        run: |
          printf 'Set repository variable `LATEXMK_RUNTIME_%s` to `%s@%s`.\n' "${PROFILE^^}" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
