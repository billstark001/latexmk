version: '2'
run:
  timeout: 5m
  allow-serial-runners: true
  relative-path-mode: cfg
linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - forbidigo
    - govet
    - ineffassign
    - nolintlint
    - staticcheck
    - unused
  settings:
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^fmt\.(Print|Fprint)(f|ln)?$'
          msg: 'Use terminal print helpers for human-readable CLI output; JSON must use its encoder.'
    staticcheck:
      checks: ['all', '-QF*']
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    presets: []
    rules:
      - path-except: '^packages/cli/cmd/latexmk/'
        linters: [forbidigo]
      - path: '^packages/cli/cmd/latexmk/(terminal\.go|.*_test\.go)$'
        linters: [forbidigo]
formatters:
  enable:
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/billstark001/latexmk
    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: false
      reformat-tags: false
      chain-split-dots: false
  exclusions:
    generated: strict
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
